<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ລະບົບຕິດຕາມການມາເຮັດວຽກ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Noto Sans Lao Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ios: {
                            bg: '#030408',
                            card: 'rgba(255, 255, 255, 0.05)',
                            border: 'rgba(255, 255, 255, 0.12)',
                            input: 'rgba(255, 255, 255, 0.07)',
                            accent: '#0a84ff',
                            success: '#30d158',
                            danger: '#ff453a',
                            warning: '#ffd60a'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Noto Sans Lao', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #030408;
            color: #ffffff;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .glass-panel {
            background: rgba(20, 20, 32, 0.65);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-header {
            background: rgba(10, 10, 18, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-nav {
            background: rgba(12, 12, 20, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        .app-view {
            display: none;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .app-view.active {
            display: flex;
            flex-direction: column;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tab-btn.active {
            color: #0a84ff;
        }
        .tab-btn.active .icon-badge {
            background: rgba(10, 132, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

    <canvas id="starfield"></canvas>

    <!-- Header -->
    <header class="glass-header sticky top-0 z-40 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-full bg-white/10 border border-white/30 flex items-center justify-center shadow-[0_0_15px_rgba(255,255,255,0.2)]">
                <i class="fa-solid fa-star text-white text-xs drop-shadow-[0_0_6px_rgba(255,255,255,0.8)]"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold tracking-wide">ລະບົບຕິດຕາມການມາເຮັດວຽກ</h1>
                <p class="text-[10px] text-white/50">System Project By JaiNtl</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="exportBackupData()" class="w-8 h-8 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-xs text-white/80 active:scale-95 transition">
                <i class="fa-solid fa-download"></i>
            </button>
            <button onclick="document.getElementById('importFile').click()" class="w-8 h-8 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-xs text-white/80 active:scale-95 transition">
                <i class="fa-solid fa-upload"></i>
            </button>
            <input type="file" id="importFile" class="hidden" accept=".json" onchange="importBackupData(event)">
        </div>
    </header>

    <main class="flex-1 max-w-lg w-full mx-auto p-4 z-10 relative">

        <!-- VIEW 1: RECORDS & LIST -->
        <div id="view-records" class="app-view active gap-3">
            <div class="glass-panel p-3 rounded-2xl flex flex-col gap-2.5 shadow-xl">
                <div class="flex items-center gap-2">
                    <div class="flex-1 relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-white/40 text-xs"></i>
                        <input type="text" id="searchInput" placeholder="ຄົ້ນຫາຊື່ພະນັກງານ..." oninput="filterRecords()" class="w-full bg-white/5 border border-white/10 rounded-xl py-2 pl-9 pr-3 text-xs text-white placeholder-white/40 focus:outline-none focus:border-ios-accent transition">
                    </div>
                    <input type="date" id="filterDate" onchange="filterRecords()" class="bg-white/5 border border-white/10 rounded-xl py-2 px-2.5 text-xs text-white focus:outline-none focus:border-ios-accent transition">
                    <button onclick="resetFilter()" class="bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white/70 active:scale-95 transition">ລ້າງ</button>
                </div>
            </div>

            <div id="recordsContainer" class="flex flex-col gap-2.5 pb-4">
                <!-- Records cards will be injected here -->
            </div>
        </div>

        <!-- VIEW 2: ADD / EDIT FORM -->
        <div id="view-add" class="app-view gap-3">
            <div class="glass-panel p-4 rounded-2xl shadow-xl flex flex-col gap-4">
                <div class="flex justify-between items-center border-b border-white/10 pb-3">
                    <h2 id="formTitleText" class="text-sm font-bold flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-ios-accent"></i> ບັນທຶກເວລາເຂົ້າ-ອອກ
                    </h2>
                    <button id="btnCancelEdit" onclick="cancelEdit()" class="hidden text-xs text-ios-danger bg-ios-danger/10 px-2.5 py-1 rounded-lg border border-ios-danger/20">ຍົກເລີກ</button>
                </div>

                <input type="hidden" id="editIndex" value="-1">

                <div class="flex flex-col gap-1.5">
                    <label class="text-xs text-white/60 font-medium">ວັນທີ:</label>
                    <input type="date" id="entryDate" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-ios-accent transition">
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-xs text-white/60 font-medium">ເລືອກຊື່ພະນັກງານ:</label>
                    <select id="entryName" class="w-full bg-[#181824] border border-white/10 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-ios-accent transition">

                <div class="grid grid-cols-2 gap-3">

                            <option value="leave">ລາພັກ / ລາກິດ (0)</option>
                            <option value="absent">ຂາດວຽກ (-ຄ່າປັບ)</option>

                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs text-white/60 font-medium">ເວລາ (HH:MM):</label>
                        <input type="time" id="entryTime" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-ios-accent transition">
                    </div>

                <button onclick="saveAttendanceEntry()" class="w-full mt-2 py-3.5 bg-gradient-to-r from-ios-accent to-indigo-500 rounded-xl text-xs font-bold text-white shadow-[0_4px_20px_rgba(10,132,255,0.3)] active:scale-[0.98] transition">

        <!-- VIEW 3: MONTHLY SUMMARY -->

                    <input type="month" id="summaryMonthPicker" onchange="renderMonthlySummary()" class="bg-white/5 border border-white/10 rounded-xl py-1.5 px-2 text-xs text-white focus:outline-none">

                <div class="flex gap-2">
                    <button onclick="exportSummaryCSV()" class="flex-1 py-2 bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition">
                        <i class="fa-solid fa-file-excel"></i> Export CSV
                    </button>
                    <button onclick="window.print()" class="flex-1 py-2 bg-white/5 border border-white/10 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition">
                        <i class="fa-solid fa-print"></i> ພິມລາຍງານ
                    </button>
                </div>

                <div class="overflow-x-auto mt-1">
                    <table class="w-full text-left border-collapse min-w-[450px]">
                        <thead>
                            <tr class="border-b border-white/10 text-[11px] text-white/50">
                                <th class="py-2.5 px-2">ຊື່ພະນັກງານ</th>
                                <th class="py-2.5 px-2 text-center">ຮັບ(+)</th>
                                <th class="py-2.5 px-2 text-center">ມາຊ້າ(-)</th>
                                <th class="py-2.5 px-2 text-center">ຂາດ(-)</th>
                                <th class="py-2.5 px-2 text-center">ລາພັກ</th>
                                <th class="py-2.5 px-2 text-right">ລວມສຸດທິ</th>
                            </tr>
                        </thead>
                        <tbody id="summaryTableBody" class="text-xs">

        <!-- VIEW 4: SETTINGS & EMPLOYEES -->
        <div id="view-settings" class="app-view gap-3">
            <div class="glass-panel p-4 rounded-2xl shadow-xl flex flex-col gap-4">
                <h2 class="text-sm font-bold flex items-center gap-2 border-b border-white/10 pb-3">
                    <i class="fa-solid fa-users text-ios-accent"></i> ຈັດການລາຍຊື່ພະນັກງານ
                </h2>

                <div class="flex gap-2">
                    <input type="text" id="newEmpName" placeholder="ພິມຊື່ພະນັກງານໃໝ່..." class="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white placeholder-white/40 focus:outline-none focus:border-ios-accent">
                    <button onclick="addNewEmployee()" class="bg-ios-accent px-4 py-2.5 rounded-xl text-xs font-semibold active:scale-95 transition">ເພີ່ມ</button>
                </div>

                <div class="max-h-40 overflow-y-auto border border-white/10 rounded-xl divide-y divide-white/5" id="employeeManageList">
                    <!-- Employee items -->
                </div>

                <h2 class="text-sm font-bold flex items-center gap-2 border-b border-white/10 pt-2 pb-3">
                    <i class="fa-solid fa-coins text-ios-warning"></i> ຕັ້ງຄ່າເງິນລາງວັນ & ປັບໃໝ
                </h2>

                <div class="grid grid-cols-2 gap-3">

                        <input type="number" id="cfgBonus" class="bg-white/5 border border-white/10 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-ios-accent">
                    </div>
                    <div class="flex flex-col gap-1">

                    </div>

                <div class="flex flex-col gap-1">
                    <label class="text-[11px] text-white/60">ເງິນຕັດຂາດວຽກ (-):</label>

            </div>
        </div>

    </main>

    <nav class="glass-nav fixed bottom-0 left-0 right-0 h-16 px-4 flex justify-around items-center z-50">
        <button onclick="switchTab('records', this)" class="tab-btn active flex flex-col items-center gap-1 text-white/60 transition">

        <button onclick="switchTab('add', this)" class="tab-btn flex flex-col items-center gap-1 text-white/60 transition">

                <i class="fa-solid fa-plus text-sm"></i>
            </div>

        <button onclick="switchTab('summary', this)" class="tab-btn flex flex-col items-center gap-1 text-white/60 transition">

                <i class="fa-solid fa-chart-pie text-sm"></i>
            </div>

        </button>
        <button onclick="switchTab('settings', this)" class="tab-btn flex flex-col items-center gap-1 text-white/60 transition">
            <div class="icon-badge w-9 h-9 rounded-xl flex items-center justify-center transition">
                <i class="fa-solid fa-gear text-sm"></i>

    <!-- Custom Modal Dialog (Replacement for alert/confirm) -->
    <div id="customModal" class="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-[100] opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="glass-panel w-full max-w-xs p-5 rounded-3xl flex flex-col gap-4 shadow-2xl scale-95 transition-transform duration-300" id="modalBox">
            <div class="flex items-center gap-3">
                <div id="modalIconBox" class="w-10 h-10 rounded-full bg-ios-accent/20 flex items-center justify-center text-ios-accent">
                    <i id="modalIcon" class="fa-solid fa-circle-info text-base"></i>
                </div>
                <div>
                    <h3 id="modalTitle" class="text-sm font-bold">ແຈ້ງເຕືອນ</h3>
                    <p id="modalMessage" class="text-xs text-white/60 mt-0.5">ຂໍ້ຄວາມ...</p>
                </div>
            </div>
            <div class="flex gap-2 mt-2" id="modalActions">
                <button onclick="closeModal()" class="flex-1 py-2.5 bg-white/10 rounded-xl text-xs font-semibold">ປິດ</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastBox" class="fixed top-16 left-1/2 -translate-x-1/2 bg-[#1a1a26]/95 backdrop-blur-xl border border-white/15 px-4 py-2.5 rounded-full flex items-center gap-2.5 shadow-2xl z-[200] opacity-0 pointer-events-none transition-all duration-300 translate-y-[-10px]">
        <i id="toastIcon" class="fa-solid fa-circle-check text-ios-success text-sm"></i>
        <span id="toastMsg" class="text-xs font-medium text-white"></span>
    </div>

    <script>
        /* Helper for Local Date String (Compatible with older mobile webviews) */
        function getLocalDateString(date) {
            const targetDate = date || new Date();
            const year = targetDate.getFullYear();
            const month = String(targetDate.getMonth() + 1).padStart(2, '0');
            const day = String(targetDate.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        /* Starfield Animation */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        });

        let stars = [];
        const numStars = 60;

        function initStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.3 + 0.3,
                    alpha: Math.random(),
                    speed: Math.random() * 0.01 + 0.003,
                    increasing: Math.random() > 0.5
                });
            }
        }

        let shootingStars = [];
        function createShootingStar() {
            const x = Math.random() * width * 1.2;
            const y = Math.random() * (height * 0.4);
            const length = Math.random() * 50 + 30;
            const speed = Math.random() * 8 + 8;
            const angle = Math.PI / 4;
            shootingStars.push({ x, y, dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed, length, life: 1, decay: 0.012 });
        }

        function scheduleShootingStar() {
            createShootingStar();
            setTimeout(scheduleShootingStar, Math.random() * 4000 + 2000);
        }

        function animateBg() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(s => {
                s.alpha += s.increasing ? s.speed : -s.speed;
                if (s.alpha >= 1) s.increasing = false;
                if (s.alpha <= 0.2) s.increasing = true;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha * 0.7})`;
                ctx.fill();
            });

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                let ss = shootingStars[i];
                ss.x += ss.dx; ss.y += ss.dy; ss.life -= ss.decay;
                if (ss.life <= 0) { shootingStars.splice(i, 1); continue; }
                let tailX = ss.x - (ss.dx / Math.hypot(ss.dx, ss.dy)) * ss.length;
                let tailY = ss.y - (ss.dy / Math.hypot(ss.dx, ss.dy)) * ss.length;
                let grad = ctx.createLinearGradient(ss.x, ss.y, tailX, tailY);
                grad.addColorStop(0, `rgba(255,255,255,${ss.life})`);
                grad.addColorStop(1, 'rgba(10,132,255,0)');
                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(tailX, tailY);
                ctx.lineWidth = 1.2;
                ctx.strokeStyle = grad;
                ctx.stroke();
            }
            requestAnimationFrame(animateBg);
        }

        initStars();
        animateBg();
        scheduleShootingStar();

        /* App State & Logic */
        const defaultEmployees = ["ນາງກີ້", "ນາງການ", "ນາງປ້ຳ", "ນາງແລນລີ້", "ຊາຍຈັນ"];

        document.addEventListener("DOMContentLoaded", () => {
            setDefaultDateTime();
            loadEmployees();
            loadSettings();
            loadRecords();
            const now = new Date();
            document.getElementById('summaryMonthPicker').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        });

        function switchTab(tabId, btnEl) {
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${tabId}`).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            if(tabId === 'summary') renderMonthlySummary();
        }

        function showToast(msg, icon = 'fa-circle-check', color = 'var(--ios-success)') {
            const toast = document.getElementById('toastBox');
            document.getElementById('toastMsg').textContent = msg;
            const iconEl = document.getElementById('toastIcon');
            iconEl.className = `fa-solid ${icon}`;
            iconEl.style.color = color;
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(-50%) translateY(0)';
            toast.style.pointerEvents = 'auto';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(-10px)';
                toast.style.pointerEvents = 'none';
            }, 2500);
        }

        function showCustomModal(title, msg, actionsHtml, icon = 'fa-circle-info', iconColor = 'text-ios-accent') {
            const modal = document.getElementById('customModal');
            const box = document.getElementById('modalBox');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = msg;
            document.getElementById('modalIcon').className = `fa-solid ${icon} text-base`;
            document.getElementById('modalIconBox').className = `w-10 h-10 rounded-full bg-white/10 flex items-center justify-center ${iconColor}`;
            document.getElementById('modalActions').innerHTML = actionsHtml;
            modal.style.opacity = '1';
            modal.style.pointerEvents = 'auto';
            box.style.transform = 'scale(1)';
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            const box = document.getElementById('modalBox');
            modal.style.opacity = '0';
            modal.style.pointerEvents = 'none';
            box.style.transform = 'scale(0.95)';
        }

        function setDefaultDateTime() {
            const now = new Date();
            document.getElementById('entryDate').value = getLocalDateString(now);
            document.getElementById('entryTime').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        function toggleTimeInput() {
            const st = document.getElementById('entryStatus').value;
            const timeInput = document.getElementById('entryTime');
            if(st === 'absent' || st === 'leave') {
                timeInput.disabled = true;
                timeInput.value = '';
            } else {
                timeInput.disabled = false;
                setDefaultDateTime();
            }
        }

        function formatDate(dateStr) {
            if(!dateStr) return '';
            const p = dateStr.split('-');
            return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : dateStr;
        }

        function getConfig() {
            return JSON.parse(localStorage.getItem('appConfig')) || { bonus: 10000, lateCut: 20000, absentCut: 50000 };
        }

        function saveConfigSettings() {
            const cfg = {
                bonus: Number(document.getElementById('cfgBonus').value) || 10000,
                lateCut: Number(document.getElementById('cfgLateCut').value) || 20000,
                absentCut: Number(document.getElementById('cfgAbsentCut').value) || 50000
            };
            localStorage.setItem('appConfig', JSON.stringify(cfg));
            showToast('ບັນທຶກການຕັ້ງຄ່າສຳເລັດ');
            loadRecords();
        }

        function loadSettings() {
            const cfg = getConfig();
            document.getElementById('cfgBonus').value = cfg.bonus;
            document.getElementById('cfgLateCut').value = cfg.lateCut;
            document.getElementById('cfgAbsentCut').value = cfg.absentCut;
        }

        function getEmployees() {
            let emps = JSON.parse(localStorage.getItem('employeeList'));
            if(!emps || emps.length === 0) {
                emps = defaultEmployees;
                localStorage.setItem('employeeList', JSON.stringify(emps));
            }
            return emps;
        }

        function loadEmployees() {
            const emps = getEmployees();
            const select = document.getElementById('entryName');
            const list = document.getElementById('employeeManageList');
            select.innerHTML = ''; list.innerHTML = '';

            emps.forEach((emp, idx) => {
                const opt = document.createElement('option');
                opt.value = emp; opt.textContent = emp;
                select.appendChild(opt);

                const item = document.createElement('div');
                item.className = 'flex justify-between items-center p-2.5 text-xs';
                item.innerHTML = `<span>${emp}</span> <button onclick="deleteEmployee(${idx})" class="text-ios-danger bg-ios-danger/10 px-2.5 py-1 rounded-lg border border-ios-danger/20 font-medium">ລຶບ</button>`;
                list.appendChild(item);
            });
        }

        function addNewEmployee() {
            const nameInput = document.getElementById('newEmpName');
            const name = nameInput.value.trim();
            if(!name) return showToast('ກະລຸນາພິມຊື່', 'fa-circle-exclamation', 'var(--ios-danger)');
            let emps = getEmployees();
            if(emps.includes(name)) return showToast('ມີຊື່ນີ້ແລ້ວ', 'fa-circle-exclamation', 'var(--ios-danger)');
            emps.push(name);
            localStorage.setItem('employeeList', JSON.stringify(emps));
            nameInput.value = '';
            loadEmployees();
            showToast('ເພີ່ມພະນັກງານສຳເລັດ');
        }

        function deleteEmployee(idx) {
            let emps = getEmployees();
            showCustomModal('ຢືນຢັນການລຶບ', `ຕ້ອງການລຶບ "${emps[idx]}" ອອກບໍ?`, `
                <button onclick="closeModal()" class="flex-1 py-2.5 bg-white/10 rounded-xl text-xs font-semibold">ຍົກເລີກ</button>
                <button onclick="confirmDeleteEmp(${idx})" class="flex-1 py-2.5 bg-ios-danger text-white rounded-xl text-xs font-semibold">ລຶບ</button>
            `, 'fa-triangle-exclamation', 'text-ios-danger');
        }

        function confirmDeleteEmp(idx) {
            let emps = getEmployees();
            emps.splice(idx, 1);
            localStorage.setItem('employeeList', JSON.stringify(emps));
            loadEmployees();
            closeModal();
            showToast('ລຶບພະນັກງານສຳເລັດ');
        }

        function calculateMoney(rawDate, timeStr, status) {
            const cfg = getConfig();
            if(status === 'absent') return { text: `-${cfg.absentCut.toLocaleString()} ກີບ (ຂາດວຽກ)`, class: "text-ios-danger font-bold", val: -cfg.absentCut, type: 'absent' };
            if(status === 'leave') return { text: "0 ກີບ (ລາພັກ)", class: "text-ios-warning font-semibold", val: 0, type: 'leave' };
            if(!rawDate || !timeStr) return { text: "0 ກີບ", class: "text-white/50", val: 0, type: 'zero' };

            const [h, m] = timeStr.split(':').map(Number);
            const timeInMin = h * 60 + m;
            
            const parts = rawDate.split('-').map(Number);
            const y = parts[0];
            const mon = parts[1];
            const d = parts[2];
            const dayOfWeek = new Date(y, mon - 1, d).getDay();
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

            if(!isWeekend) {
                if(timeInMin >= (14 * 60) && timeInMin <= (16 * 60 + 30)) return { text: `+${cfg.bonus.toLocaleString()} ກີບ (ຮັບເງິນ)`, class: "text-ios-success font-bold", val: cfg.bonus, type: 'add' };
                if(timeInMin > (16 * 60 + 30) && timeInMin < (17 * 60)) return { text: "0 ກີບ (ປົກກະຕິ)", class: "text-white/50", val: 0, type: 'zero' };
                if(timeInMin >= (17 * 60) && timeInMin < (19 * 60)) return { text: `-${cfg.lateCut.toLocaleString()} ກີບ (ມາຊ້າ)`, class: "text-ios-danger font-bold", val: -cfg.lateCut, type: 'cut' };
                if(timeInMin >= (19 * 60)) return { text: `-${cfg.absentCut.toLocaleString()} ກີບ (ຂາດວຽກ)`, class: "text-ios-danger font-bold", val: -cfg.absentCut, type: 'absent' };
            } else {
                if(timeInMin >= (14 * 60) && timeInMin <= (15 * 60 + 30)) return { text: `+${cfg.bonus.toLocaleString()} ກີບ (ຮັບເງິນ)`, class: "text-ios-success font-bold", val: cfg.bonus, type: 'add' };
                if(timeInMin > (15 * 60 + 30) && timeInMin < (16 * 60)) return { text: "0 ກີບ (ປົກກະຕິ)", class: "text-white/50", val: 0, type: 'zero' };
                if(timeInMin >= (16 * 60) && timeInMin < (19 * 60)) return { text: `-${cfg.lateCut.toLocaleString()} ກີບ (ມາຊ້າ)`, class: "text-ios-danger font-bold", val: -cfg.lateCut, type: 'cut' };
                if(timeInMin >= (19 * 60)) return { text: `-${cfg.absentCut.toLocaleString()} ກີບ (ຂາດວຽກ)`, class: "text-ios-danger font-bold", val: -cfg.absentCut, type: 'absent' };
            }
            return { text: "ມາກ່ອນເວລາ", class: "text-white/50", val: 0, type: 'zero' };
        }

        function saveAttendanceEntry() {
            const rawDate = document.getElementById('entryDate').value;
            const name = document.getElementById('entryName').value;
            const status = document.getElementById('entryStatus').value;
            const rawTime = document.getElementById('entryTime').value;
            const editIdx = parseInt(document.getElementById('editIndex').value);

            if(!name) return showToast('ກະລຸນາເລືອກຊື່ພະນັກງານ', 'fa-circle-exclamation', 'var(--ios-danger)');
            if(!rawDate) return showToast('ກະລຸນາເລືອກວັນທີ', 'fa-circle-exclamation', 'var(--ios-danger)');
            if(status === 'normal' && !rawTime) {
                return showToast('ກະລຸນາເລືອກເວລາ', 'fa-circle-exclamation', 'var(--ios-danger)');
            }

            const timeDisplay = (status === 'absent') ? 'ຂາດວຽກ' : (status === 'leave' ? 'ລາພັກ' : rawTime);
            const calc = calculateMoney(rawDate, rawTime, status);
            let entries = JSON.parse(localStorage.getItem('employeeEntries')) || [];

            const entryObj = {
                rawDate, date: formatDate(rawDate), name, status, rawTime, time: timeDisplay,
                moneyText: calc.text, moneyClass: calc.class, val: calc.val, type: calc.type
            };

            if(editIdx >= 0) {
                entries[editIdx] = entryObj;
                cancelEdit();
                showToast('ແກ້ໄຂຂໍ້ມູນສຳເລັດ');
            } else {
                entries.push(entryObj);
                showToast('ບັນທຶກຂໍ້ມູນສຳເລັດ');
            }

            localStorage.setItem('employeeEntries', JSON.stringify(entries));
            loadRecords();
            switchTab('records', document.querySelectorAll('.tab-btn')[0]);
        }

        function loadRecords() {
            let entries = JSON.parse(localStorage.getItem('employeeEntries')) || [];
            renderRecordsList(entries);
        }

        function filterRecords() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const dateVal = document.getElementById('filterDate').value;
            let entries = JSON.parse(localStorage.getItem('employeeEntries')) || [];

            const filtered = entries.filter(e => {
                const matchName = e.name.toLowerCase().includes(query);
                const matchDate = !dateVal || e.rawDate === dateVal;
                return matchName && matchDate;
            });
            renderRecordsList(filtered);
        }

        function resetFilter() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterDate').value = '';
            loadRecords();
        }

        function renderRecordsList(entries) {
            const container = document.getElementById('recordsContainer');
            container.innerHTML = '';
            if(entries.length === 0) {
                container.innerHTML = `<div class="glass-panel p-8 rounded-2xl text-center text-white/40 text-xs">ບໍ່ມີຂໍ້ມູນການມາເຮັດວຽກ</div>`;
                return;
            }

            let lastDate = '';
            entries.forEach((entry, idx) => {
                if(entry.date && entry.date !== lastDate) {
                    lastDate = entry.date;
                    const dateHeader = document.createElement('div');
                    dateHeader.className = 'text-[11px] font-semibold text-ios-accent px-1 pt-2 flex items-center gap-1.5';
                    dateHeader.innerHTML = `<i class="fa-regular fa-calendar-days"></i> ${entry.date}`;
                    container.appendChild(dateHeader);
                }

                const card = document.createElement('div');
                card.className = 'glass-panel p-3.5 rounded-2xl flex justify-between items-center shadow-lg';
                card.innerHTML = `
                    <div class="flex flex-col gap-1">
                        <span class="text-xs font-bold">${entry.name}</span>
                        <span class="text-[11px] text-white/50"><i class="fa-regular fa-clock mr-1"></i> ${entry.time || '-'}</span>
                        <span class="text-xs ${entry.moneyClass}">${entry.moneyText}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="editEntry(${idx})" class="w-8 h-8 rounded-xl bg-ios-accent/15 text-ios-accent flex items-center justify-center text-xs active:scale-95 transition">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteEntry(${idx})" class="w-8 h-8 rounded-xl bg-ios-danger/15 text-ios-danger flex items-center justify-center text-xs active:scale-95 transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function editEntry(idx) {
            let entries = JSON.parse(localStorage.getItem('employeeEntries')) || [];
            const e = entries[idx];
            if(!e) return;

            document.getElementById('editIndex').value = idx;
            document.getElementById('entryDate').value = e.rawDate || '';
            document.getElementById('entryName').value = e.name;
            document.getElementById('entryStatus').value = e.status || 'normal';
            toggleTimeInput();
            if(e.status === 'normal') document.getElementById('entryTime').value = e.rawTime || '';

            document.getElementById('formTitleText').innerHTML = '<i class="fa-solid fa-pen text-ios-accent"></i> ແກ້ໄຂຂໍ້ມູນ';
            document.getElementById('btnCancelEdit').classList.remove('hidden');
            switchTab('add', document.querySelectorAll('.tab-btn')[1]);
        }

        function cancelEdit() {
            document.getElementById('editIndex').value = '-1';
            document.getElementById('formTitleText').innerHTML = '<i class="fa-solid fa-pen-to-square text-ios-accent"></i> ບັນທຶກເວລາເຂົ້າ-ອອກ';
            document.getElementById('btnCancelEdit').classList.add('hidden');
            document.getElementById('entryStatus').value = 'normal';
            toggleTimeInput();
            setDefaultDateTime();
        }

        function deleteEntry(idx) {
            showCustomModal('ຢືນຢັນການລຶບ', 'ທ່ານຕ້ອງການລຶບລາຍການນີ້ແທ້ບໍ?', `
                <button onclick="closeModal()" class="flex-1 py-2.5 bg-white/10 rounded-xl text-xs font-semibold">ຍົກເລີກ</button>
                <button onclick="confirmDeleteEntry(${idx})" class="flex-1 py-2.5 bg-ios-danger text-white rounded-xl text-xs font-semibold">ລຶບ</button>
            `, 'fa-triangle-exclamation', 'text-ios-danger');
        }

        function confirmDeleteEntry(idx) {
            let entries = JSON.parse(localStorage.getItem('employeeEntries')) || [];
            entries.splice(idx, 1);
            localStorage.setItem('employeeEntries', JSON.stringify(entries));
            loadRecords();
            closeModal();
            showToast('ລຶບລາຍການສຳເລັດ');
        }

        function clearAllData() {
            showCustomModal('ລຶບຂໍ້ມູນທັງໝົດ', 'ທ່ານຕ້ອງການລຶບປະຫວັດການບັນທຶກທັງໝົດແທ້ບໍ?', `
                <button onclick="closeModal()" class="flex-1 py-2.5 bg-white/10 rounded-xl text-xs font-semibold">ຍົກເລີກ</button>
                <button onclick="confirmClearAll()" class="flex-1 py-2.5 bg-ios-danger text-white rounded-xl text-xs font-semibold">ລຶບທັງໝົດ</button>
            `, 'fa-triangle-exclamation', 'text-ios-danger');
        }

        function confirmClearAll() {
            localStorage.removeItem('employeeEntries');
            loadRecords();
            closeModal();
            showToast('ລຶບຂໍ້ມູນທັງໝົດແລ້ວ');
        }

        function renderMonthlySummary() {
            const month = document.getElementById('summaryMonthPicker').value;
            if(!month) return;
            const emps = getEmployees();
            const entries = JSON.parse(localStorage.getItem('employeeEntries')) || [];
            const cfg = getConfig();
            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = '';

            emps.forEach(emp => {
                let addC = 0, cutC = 0, absentC = 0, leaveC = 0, total = 0;
                entries.forEach(e => {
                    if(e.name === emp && e.rawDate && e.rawDate.startsWith(month)) {
                        if(e.type === 'add') { addC++; total += cfg.bonus; }
                        else if(e.type === 'cut') { cutC++; total -= cfg.lateCut; }
                        else if(e.type === 'absent') { absentC++; total -= cfg.absentCut; }
                        else if(e.type === 'leave') { leaveC++; }
                    }
                });

                const row = document.createElement('tr');
                row.className = 'border-b border-white/5';
                row.innerHTML = `
                    <td class="py-3 px-2 font-semibold">${emp}</td>
                    <td class="py-3 px-2 text-center text-ios-success">${addC}</td>
                    <td class="py-3 px-2 text-center text-ios-danger">${cutC}</td>
                    <td class="py-3 px-2 text-center text-red-500">${absentC}</td>
                    <td class="py-3 px-2 text-center text-ios-warning">${leaveC}</td>
                    <td class="py-3 px-2 text-right font-bold ${total >= 0 ? 'text-ios-success' : 'text-ios-danger'}">${total.toLocaleString()} ₭</td>
                `;
                tbody.appendChild(row);
            });
        }

        function exportSummaryCSV() {
            const month = document.getElementById('summaryMonthPicker').value;
            const emps = getEmployees();
            const entries = JSON.parse(localStorage.getItem('employeeEntries')) || [];
            const cfg = getConfig();
            let csv = "\uFEFFຊື່ພະນັກງານ,ຮັບ(+),ມາຊ້າ(-),ຂາດ(-),ລາພັກ,ຍອດລວມສຸດທິ (ກີບ)\n";

            emps.forEach(emp => {
                let addC = 0, cutC = 0, absentC = 0, leaveC = 0, total = 0;
                entries.forEach(e => {
                    if(e.name === emp && e.rawDate && e.rawDate.startsWith(month)) {
                        if(e.type === 'add') { addC++; total += cfg.bonus; }
                        else if(e.type === 'cut') { cutC++; total -= cfg.lateCut; }
                        else if(e.type === 'absent') { absentC++; total -= cfg.absentCut; }
                        else if(e.type === 'leave') { leaveC++; }
                    }
                });
                csv += `"${emp}",${addC},${cutC},${absentC},${leaveC},${total}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Summary_${month}.csv`;
            link.click();
            showToast('Export CSV ສຳເລັດ');
        }

        function exportBackupData() {
            const backup = {
                employeeList: JSON.parse(localStorage.getItem('employeeList')),
                employeeEntries: JSON.parse(localStorage.getItem('employeeEntries')),
                appConfig: JSON.parse(localStorage.getItem('appConfig'))
            };
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Attendance_Backup_${getLocalDateString()}.json`;
            link.click();
            showToast('ສຳຮອງຂໍ້ມູນສຳເລັດ');
        }

        function importBackupData(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    if(data.employeeList) localStorage.setItem('employeeList', JSON.stringify(data.employeeList));
                    if(data.employeeEntries) localStorage.setItem('employeeEntries', JSON.stringify(data.employeeEntries));
                    if(data.appConfig) localStorage.setItem('appConfig', JSON.stringify(data.appConfig));
                    loadEmployees();
                    loadSettings();
                    loadRecords();
                    showToast('ນຳເຂົ້າຂໍ້ມູນສຳເລັດ');
                } catch(err) {
                    showToast('ໄຟລ໌ບໍ່ຖືກຕ້ອງ', 'fa-circle-xmark', 'var(--ios-danger)');
                }
            };
            reader.readAsText(file);
        }
    </script>
